name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
